name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-linux-qt6:
    name: Build GUI with Qt6 (Ubuntu)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Check version consistency
      run: |
        cmake_ver=$(sed -n 's/^project(OctoSnap VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
        pkg_ver=$(sed -n 's/^DISTNAME=[[:space:]]*octosnap-//p' netbsd/Makefile)
        echo "CMakeLists.txt: $cmake_ver / netbsd/Makefile: $pkg_ver"
        test -n "$cmake_ver" && test "$cmake_ver" = "$pkg_ver"
        grep -q "^## \[$cmake_ver\]" CHANGELOG.md

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build clang libgl1-mesa-dev

    # Ubuntu ships Qt 6.4; the project requires Qt >= 6.5.
    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.3'
        cache: true

    - name: Configure CMake
      run: |
        cmake -B build -S . -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER=clang++

    # The helper uses NetBSD-only APIs (fss(4), getmntinfo/statvfs);
    # it is built in the NetBSD job below.
    - name: Build GUI with CMake
      run: |
        cmake --build build --target octosnap --verbose

  build-netbsd:
    name: Build on NetBSD (VM)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Build on NetBSD
      uses: vmactions/netbsd-vm@v1
      with:
        usesh: true
        prepare: |
          set -e
          # The VM image has no X11 sets; Qt6 binary packages link against
          # /usr/X11R7 (libxcb, libX11, libGL), and Qt's CMake config needs the headers.
          for set in xbase xcomp; do
            ftp -o - "https://cdn.netbsd.org/pub/NetBSD/NetBSD-$(uname -r)/$(uname -m)/binary/sets/${set}.tar.xz" \
              | tar -xJpf - -C /
          done
          command -v pkgin >/dev/null || /usr/sbin/pkg_add pkgin
          pkgin -y install cmake ninja-build qt6-qtbase qt6-qttools
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/pkg/qt6
          cmake --build build
